# Terminology Master 人工判斷規則
#
# 供 tools/build_terminology_master.py 產生 configs/terminology_master.yaml 時套用。
# 把人工判斷集中在這個可審核的 YAML，避免藏在產生器程式碼裡被無聲套用。
#
# 三個區段（key 皆為 normalized term：小寫、壓縮空白）：
#   deprecated         - 2026-08 校稿統一前的廢棄譯名，供校稿時全文搜尋，發現舊寫法應改為標準譯名
#   contextual         - 刻意保留的語境差異說明（這些不算不一致）
#   needs_verification - 譯名依集數原始研究保留，但準確性待查證
#
# 修改本檔後請重新執行：PYTHONPATH=. python3 tools/build_terminology_master.py --force


contextual:
  extraterrestrial: 形容詞用法統一為「外星的」；UFO-13 名詞用法保留「外星生命」，屬合理語境差異
  entity: 統一為「實體」；UFO-10 有機構義用法，保留「實體/機構」
  general assembly: 聯合國語境譯「聯合國大會」；UFO-14 為烏拉圭語境，譯「烏拉圭國民議會」
  ministry of defense: 英國語境（UFO-05 藍道申事件）譯「英國國防部」；南美集數譯「國防部」
  national archives: 依國別語境：美國國家檔案館／巴西國家檔案館
  national security agency: 全名統一為「國家安全局」；縮寫 NSA 詞條用「國家安全局（NSA）」
  foo fighters: 統一為「幽浮光球」；UFO-15 保留原文標註（Foo Fighters）
  george h.w. bush: 兩種稱謂依語境並存：喬治·H·W·布希／老布希總統
  disclosure: UFO 揭露運動語境統一為「真相揭露」（disclosure_truth）；UFO-11 segment 190 與 UFO-12 segment 81 指 non-disclosure agreements，譯「保密協議」（disclosure_nda），兩者為不同語義
  ancient aliens: 指 History Channel 節目時譯《遠古外星人》（ancient_aliens_show，UFO-14、17）；UFO-15 segment 119 為普通名詞「遠古外星人」（ancient_aliens_theory），不加書名號

needs_verification: {}
